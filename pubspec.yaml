name: web_ui_plugin
description: "Plug-and-play SaaS admin UI plugin framework for Flutter Web."
version: 0.1.0
repository: https://github.com/ArindamBhatta/web_ui_plugin

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1

  firebase_core: ^4.1.0
  cloud_firestore: ^6.0.1
  firebase_auth: ^6.4.0
  firebase_storage: ^13.3.0
  cloud_functions: ^6.0.1

  go_router: ^16.2.0

  equatable: ^2.0.7
  uuid: ^4.5.1

  syncfusion_flutter_datepicker: ^29.2.11 # For date picking functionality
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  google_fonts: ^7.0.0
  flutter_spinkit: ^5.2.1 # For loading indicators
  data_table_2: ^2.6.0 # For data tables
  animations: ^2.1.0 # For animations
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1 # For page indicators
  fl_chart: ^1.2.1 # For charts
  lucide_icons_flutter: ^2.3.0 # For lucide icons
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0 # For bloc testing
  mocktail: ^1.0.4 # For mock testing
  flutter_lints: ^5.0.0 # For linting
  fake_cloud_firestore: ^4.1.1 # For fake cloud firestore
